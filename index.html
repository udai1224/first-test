<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプルなWebサイト</title>

  <style>
    /* 全体 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: aqua;
      color: #333;
    }

    /* ヘッダー */
    header {
      background-color: #00FF00;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    /* メイン */
    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px 120px;
    }

    section {
      background-color: white;
      padding: 25px;
      margin-bottom: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    section h2 {
      color: #2c3e50;
      margin-top: 0;
    }

    /* フッター */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #000000;
      color: white;
      padding: 15px;
      text-align: center;
    }

    footer p {
      margin: 5px 0;
    }

    footer a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <!-- ヘッダー -->
  <header>
    <h1>gamersWebサイト</h1>
  </header>

  <!-- メインコンテンツ -->
  <main>

    <section>
      <h2>私たちについて</h2>
      <p>
        これはHTMLとCSSだけで作成したシンプルなWebサイトです。
        私たちのおすすめゲームについての情報を掲載しています。
      </p>
    </section>

    <section>
      <h2>サービスについて</h2>
      <p>
        お客様に便利で使いやすいサービスを提供しています。
        詳しいサービス内容や特徴などをここに記載できます。
      </p>
    </section>

  </main>

  <!-- フッター -->
  <footer>
    <p>お問い合わせ：info@example.com</p>
    <p>
      <a href="#">X</a>
      <a href="#">Instagram</a>
      <a href="#">Facebook</a>
    </p>
  </footer>

</body>
</html>
